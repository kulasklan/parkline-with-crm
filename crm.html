<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkLine Residences - CRM</title>
    <link rel="stylesheet" href="css/base.css">

    <!-- HubSpot Tracking Code -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-eu1.hs-scripts.com/147144255.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: rgba(255, 255, 255, 0.95);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 600px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f97316;
            margin-bottom: 1rem;
        }

        h1 {
            color: rgba(255, 255, 255, 0.95);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(148, 163, 184, 0.9);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .redirect-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6);
        }

        .countdown {
            margin-top: 2rem;
            color: rgba(148, 163, 184, 0.7);
            font-size: 0.9rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(249, 115, 22, 0.3);
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">PARKLINE</div>
        <h1>CRM Dashboard</h1>
        <p>Access your lead management and analytics through HubSpot CRM.</p>

        <a href="https://app.hubspot.com/contacts/147144255" class="redirect-btn">
            Open HubSpot CRM
        </a>

        <div class="countdown">
            <div class="spinner"></div>
            Redirecting automatically in <span id="countdown">5</span> seconds...
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');

        const countdown = setInterval(() => {
            seconds--;
            if (countdownElement) {
                countdownElement.textContent = seconds;
            }

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://app.hubspot.com/contacts/147144255';
            }
        }, 1000);
    </script>
</body>
</html>
